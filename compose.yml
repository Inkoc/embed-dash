services:
  embed-dash:
    build: .
    ports:
      - "127.0.0.1:8742:8742"
    environment:
      # Trust only the IP addresses of proxies that replace forwarded headers.
      TRUST_PROXY: ${TRUST_PROXY:-off}
      AUTH_MODE: ${AUTH_MODE:-password}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      BOT_TOKEN_FILE: /run/secrets/bot_token
      DATA_DIR: /data
      PORT: "8742"
      HOST: "0.0.0.0"
    secrets:
      - bot_token
      - admin_password
    volumes:
      - embed-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8742/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
volumes:
  embed-data:
secrets:
  bot_token:
    file: ./secrets/bot_token.txt
  admin_password:
    # No password file in local mode: set ADMIN_PASSWORD_SECRET_FILE=/dev/null.
    file: ${ADMIN_PASSWORD_SECRET_FILE:-./secrets/admin_password.txt}
