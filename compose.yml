services:
  embed-dash:
    build: .
    ports:
      - "127.0.0.1:8742:8742"
    environment:
      # Trust only proxies that replace forwarded headers: their IPs or their
      # Docker network's CIDR range (see the README).
      TRUST_PROXY: ${TRUST_PROXY:-off}
      AUTH_MODE: ${AUTH_MODE:-password}
      # Used only with AUTH_MODE=discord; see the README.
      PUBLIC_URL: ${PUBLIC_URL:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET_FILE: /run/secrets/discord_client_secret
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:-}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      BOT_TOKEN_FILE: /run/secrets/bot_token
      DATA_DIR: /data
      PORT: "8742"
      HOST: "0.0.0.0"
    secrets:
      - bot_token
      - admin_password
      - discord_client_secret
    volumes:
      - embed-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8742/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
volumes:
  embed-data:
secrets:
  bot_token:
    file: ./secrets/bot_token.txt
  admin_password:
    # No password file in local mode: set ADMIN_PASSWORD_SECRET_FILE=/dev/null.
    file: ${ADMIN_PASSWORD_SECRET_FILE:-./secrets/admin_password.txt}
  discord_client_secret:
    # Empty unless AUTH_MODE=discord: set DISCORD_CLIENT_SECRET_SOURCE=./secrets/discord_client_secret.txt.
    file: ${DISCORD_CLIENT_SECRET_SOURCE:-/dev/null}
